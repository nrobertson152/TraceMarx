name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux display and Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-tk
      - run: python -m pip install -e ".[dev]"
      - name: Tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -ra
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -ra
      - name: Self-test of the installed program
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a tracemarx-gui --self-test report.txt; else python -m tracemarx --self-test report.txt; fi
          cat report.txt
          grep -q "self-test PASSED" report.txt
          python -m tracemarx check tracemarx/demo/demo_project.schematix
