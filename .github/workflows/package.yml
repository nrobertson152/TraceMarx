# Standalone TraceMarx builds (no Python needed): Windows x64 zip and Linux x86-64 tar.gz.
# Each build is started and self-tested before it is kept. Artifacts only: never a GitHub Release or tag.
name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.os }} standalone build"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform_name: windows-x64}
          - {os: ubuntu-22.04, platform_name: linux-x86_64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux display and Tk
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-tk
      - run: python -m pip install . "pyinstaller>=6.5"
      - run: pyinstaller packaging/tracemarx.spec --noconfirm --distpath dist --workpath build
      - name: Licence and notices
        shell: bash
        run: cp LICENSE README.md CHANGELOG.md dist/TraceMarx/
      - name: Self-test the build
        shell: bash
        run: |
          report="$RUNNER_TEMP/selftest.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "\$p = Start-Process -FilePath 'dist/TraceMarx/tracemarx.exe' -ArgumentList '--self-test','$report' -Wait -PassThru; exit \$p.ExitCode"
          else
            xvfb-run -a dist/TraceMarx/tracemarx --self-test "$report"
          fi
          cat "$report"
          grep -q "self-test PASSED" "$report"
      - name: Archive and checksum
        shell: bash
        run: |
          version=$(python -c "import tracemarx; print(tracemarx.__version__)")
          name="TraceMarx-${version}-${{ matrix.platform_name }}"
          cd dist && mv TraceMarx "$name"
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip -bd "$name.zip" "$name" > /dev/null; a="$name.zip"; else tar -czf "$name.tar.gz" "$name"; a="$name.tar.gz"; fi
          sha256sum "$a" | tee "$a.sha256"
          echo "ARCHIVE=dist/$a" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.platform_name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 30
          if-no-files-found: error
